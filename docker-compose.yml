version: "3"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/code
      - ~/.config/gcloud:/root/.config/gcloud:ro
      - ${EDC_SCHEMAS_HOST_DIR:-/home/uchida/ai-stack/EDC/schemas}:/edc_schemas:ro
    env_file:
      - ./backend/.env
    environment:
      - KNN_MIN_SCORE=${KNN_MIN_SCORE-0.94}
      - IS_EMBEDDING=${IS_EMBEDDING-true}
      - GCP_LOG_METRICS_ENABLED=${GCP_LOG_METRICS_ENABLED-False}
      - UPDATE_GRAPH_CHUNKS_PROCESSED=${UPDATE_GRAPH_CHUNKS_PROCESSED-20}
      - ENTITY_EMBEDDING=${ENTITY_EMBEDDING-False}
      - GCS_FILE_CACHE=${GCS_FILE_CACHE-False}
      - LLM_MODEL_CONFIG_OPENAI_GPT_5_5=${LLM_MODEL_CONFIG_OPENAI_GPT_5_5-}
      - LLM_MODEL_CONFIG_OPENAI_GPT_5_4_MINI=${LLM_MODEL_CONFIG_OPENAI_GPT_5_4_MINI-}
      - LLM_MODEL_CONFIG_GEMINI_3_5_FLASH=${LLM_MODEL_CONFIG_GEMINI_3_5_FLASH-}
      - LLM_MODEL_CONFIG_DIFFBOT=${LLM_MODEL_CONFIG_DIFFBOT-}
      - LLM_MODEL_CONFIG_GROQ_LLAMA3_1_8B=${LLM_MODEL_CONFIG_GROQ_LLAMA3_1_8B-}
      - LLM_MODEL_CONFIG_ANTHROPIC_CLAUDE_4_6_SONNET=${LLM_MODEL_CONFIG_ANTHROPIC_CLAUDE_4_6_SONNET-}
      - LLM_MODEL_CONFIG_ANTHROPIC_CLAUDE_4_7_OPUS=${LLM_MODEL_CONFIG_ANTHROPIC_CLAUDE_4_7_OPUS-}
      - LLM_MODEL_CONFIG_FIREWORKS_QWEN3_6=${LLM_MODEL_CONFIG_FIREWORKS_QWEN3_6-}
      - LLM_MODEL_CONFIG_FIREWORKS_GPT_OSS=${LLM_MODEL_CONFIG_FIREWORKS_GPT_OSS-}
      - LLM_MODEL_CONFIG_FIREWORKS_DEEPSEEK_V3=${LLM_MODEL_CONFIG_FIREWORKS_DEEPSEEK_V3-}
      - LLM_MODEL_CONFIG_FIREWORKS_DEEPSEEK_V4_FLASH=${LLM_MODEL_CONFIG_FIREWORKS_DEEPSEEK_V4_FLASH-}
      - LLM_MODEL_CONFIG_FIREWORKS_KIMI_K2P6=${LLM_MODEL_CONFIG_FIREWORKS_KIMI_K2P6-}
      - LLM_MODEL_CONFIG_FIREWORKS_GLM_5_1=${LLM_MODEL_CONFIG_FIREWORKS_GLM_5_1-}

      - LLM_MODEL_CONFIG_LLAMA4_MAVERICK=${LLM_MODEL_CONFIG_LLAMA4_MAVERICK-}
      - LLM_MODEL_CONFIG_BEDROCK_NOVA_MICRO_V1=${LLM_MODEL_CONFIG_BEDROCK_NOVA_MICRO_V1-}
      - LLM_MODEL_CONFIG_BEDROCK_NOVA_LITE_V1=${LLM_MODEL_CONFIG_BEDROCK_NOVA_LITE_V1-}
      - LLM_MODEL_CONFIG_BEDROCK_NOVA_PRO_V1=${LLM_MODEL_CONFIG_BEDROCK_NOVA_PRO_V1-}
      - LLM_MODEL_CONFIG_OLLAMA_LLAMA3=${LLM_MODEL_CONFIG_OLLAMA_LLAMA3-}
      - LLM_MODEL_CONFIG_GEMMA4=${LLM_MODEL_CONFIG_GEMMA4-}
      - LLM_MODEL_CONFIG_EDC=${LLM_MODEL_CONFIG_EDC-}
      - EDC_EXTRACTION_TIMEOUT=${EDC_EXTRACTION_TIMEOUT-}
      - EDC_ENRICH_SCHEMA=${EDC_ENRICH_SCHEMA-false}
      - EDC_FOLD_UNKNOWN_RELATIONS=${EDC_FOLD_UNKNOWN_RELATIONS-false}
      - EDC_DROP_SENTENCE_NAMES=${EDC_DROP_SENTENCE_NAMES-false}
      - EDC_SCHEMAS_DIR=/edc_schemas
      - EDC_PROPOSALS_DIR=${EDC_PROPOSALS_DIR-}
      - GRAPH_SCHEMA_CONSOLIDATION_ENABLED=${GRAPH_SCHEMA_CONSOLIDATION_ENABLED-}
      - EDC_PDF_CONVERT=${EDC_PDF_CONVERT-}
      - EDC_CONVERT_TIMEOUT=${EDC_CONVERT_TIMEOUT-}
      - MARKDOWN_CHUNKING=${MARKDOWN_CHUNKING-}
      - OPENAI_API_KEY=${OPENAI_API_KEY-}
      - DIFFBOT_API_KEY=${DIFFBOT_API_KEY-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL-}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER-}
      - VLLM_EMBEDDING_ENDPOINT=${VLLM_EMBEDDING_ENDPOINT-}
      - MAX_TOKEN_CHUNK_SIZE=${MAX_TOKEN_CHUNK_SIZE-}
      - DEFAULT_TOKEN_CHUNK_SIZE=${VITE_TOKENS_PER_CHUNK-}
      - DEFAULT_CHUNK_OVERLAP=${VITE_CHUNK_OVERLAP-}
      - DEFAULT_CHUNKS_TO_COMBINE=${VITE_CHUNK_TO_COMBINE-}
      - LOCAL_LLM_MAX_TOKENS=${LOCAL_LLM_MAX_TOKENS-}
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT-}
    container_name: backend
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - database
    ports:
      - "8440:8000"
    networks:
      - net

  frontend:
    depends_on:
      - backend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_API_URL=${VITE_BACKEND_API_URL-http://localhost:8000}
        - VITE_REACT_APP_SOURCES=${VITE_REACT_APP_SOURCES-local,wiki,s3}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID-}
        - VITE_BLOOM_URL=${VITE_BLOOM_URL-https://workspace-preview.neo4j.io/workspace/explore?connectURL={CONNECT_URL}&search=Show+me+a+graph&featureGenAISuggestions=true&featureGenAISuggestionsInternal=true}
        - VITE_TIME_PER_PAGE=${VITE_TIME_PER_PAGE-50}
        - VITE_CHUNK_SIZE=${VITE_CHUNK_SIZE-5242880}
        - VITE_LARGE_FILE_SIZE=${VITE_LARGE_FILE_SIZE-5242880}
        - VITE_ENV=${VITE_ENV-DEV}
        - VITE_CHAT_MODES=${VITE_CHAT_MODES-}
        - VITE_BATCH_SIZE=${VITE_BATCH_SIZE-2}
        - VITE_LLM_MODELS=${VITE_LLM_MODELS-}
        - VITE_LLM_MODELS_PROD=${VITE_LLM_MODELS_PROD-gemini_3.5_flash,openai_gpt_5.4_mini,diffbot,anthropic_claude_4.5_haiku}
        - VITE_AUTH0_DOMAIN=${VITE_AUTH0_DOMAIN-}
        - VITE_AUTH0_CLIENT_ID=${VITE_AUTH0_CLIENT_ID-}
        - VITE_SKIP_AUTH=${VITE_SKIP_AUTH-true}
        - VITE_CHUNK_OVERLAP=${VITE_CHUNK_OVERLAP-}
        - VITE_TOKENS_PER_CHUNK=${VITE_TOKENS_PER_CHUNK-}
        - VITE_CHUNK_TO_COMBINE=${VITE_CHUNK_TO_COMBINE-}
        - DEPLOYMENT_ENV=local
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env
    container_name: frontend
    ports:
      - "8441:8080"
    networks:
      - net

  # 専用 Neo4j（データ分離）。Community 5.26 はベクトルインデックスをネイティブ対応。
  database:
    image: neo4j:5.26-community
    container_name: neo4j-kgb
    environment:
      - NEO4J_AUTH=neo4j/kgb-please-change
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=4G
      - NEO4J_server_memory_pagecache_size=2G
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - neo4j-kgb-data:/data
      - neo4j-kgb-logs:/logs
    networks:
      - net

networks:
  net:

volumes:
  neo4j-kgb-data:
  neo4j-kgb-logs:
